<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Live Chats – Conversalytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <style>
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 150px);
    }

    .chat-header {
      background: var(--primary);
      color: #fff;
      padding: 12px 16px;
      font-weight: bold;
    }

    .chat-window {
      flex: 1 !important;
      overflow-y: auto;
      padding: 16px;
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding: 12px;
    }

    .input-area input {
      flex: 1;
    }

    body.light-mode .chat-window {
      background: var(--lightsec);
    }

    body.dark-mode .chat-window {
      background: #1e293b;
    }

    .msg-row {
      display: flex;
      align-items: end;
      margin-bottom: 12px;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.bot {
      justify-content: flex-start;
    }

    .msg {
      max-width: 70%;
      padding: 8px 14px;
      border-radius: 15px;
    }

    .msg.user {
      background: var(--primary);
      color: #fff;
    }

    .msg.bot {
      background: var(--accent);
      color: #fff;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      margin: 0 6px;
    }

    /* Dark mode visibility for feedback */
    .btn-feedback {
      font-size: 14px !important;
    }

    body.dark-mode .btn-feedback {
      color: #fff !important;
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid var(--lightsec) !important;
    }

    body.light-mode .btn-feedback {
      color: var(--primary) !important;
      background: #fff !important;
      border: 1px solid var(--border) !important;
    }
  </style>
</head>

<body class="light-mode">

  <header class="custom-header d-flex justify-content-between align-items-center px-4 py-2">
    <div class="d-flex align-items-center">
      <img src="logo.png" style="height:32px" class="me-2">
      <span class="fw-bold">Conversalytics</span>
    </div>
    <nav class="d-none d-md-block">
      <a href="index.html" class="mx-3 text-light">Dashboard</a>
      <a href="livechats.html" class="mx-3 fw-semibold text-light">Live Chats</a>
      <a href="analytics.html" class="mx-3 text-light">Analytics</a>
      <a href="contact.html" class="mx-3 text-light">Contact</a>
    </nav>
    <button id="theme-toggle" class="btn border-0 bg-transparent ms-auto fs-4">
      <i class="bi bi-moon-fill"></i>
    </button>

  </header>

  <main>
    <div class="chat-header">Conversalytics Bot</div>
    <div id="chatWindow" class="chat-window"></div>

    <div id="typingBubble" style="display:none;">
      <div class="msg-row bot">
        <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712139.png">
        <div class="msg bot">
          <span class="typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
        </div>
      </div>
    </div>

    <div class="input-area">
      <input id="userInput" class="form-control" placeholder="Type your message...">
      <button id="micBtn" class="btn btn-outline-secondary"><i class="bi bi-mic"></i></button>
      <button id="settingsBtn" class="btn btn-outline-secondary"><i class="bi bi-gear"></i></button>
      <button id="sendBtn" class="btn btn-primary">Send</button>
    </div>
  </main>

  <!-- Footer -->
<footer class="quick-links text-center py-4 mt-5 border-top">
  <h6>Quick Links</h6>
  <ul class="list-inline">
    <li class="list-inline-item"><a href="index.html">Dashboard</a></li>
    <li class="list-inline-item"><a href="livechats.html">Live Chats</a></li>
    <li class="list-inline-item"><a href="analytics.html">Analytics</a></li>
    <li class="list-inline-item"><a href="contact.html">Contact</a></li>
  </ul>
  <div class="mt-2 text-muted">© 2025 Conversalytics. All rights reserved.</div>
</footer>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script>
    const HF_URL = "https://api-inference.huggingface.co/models/distilbert-base-uncased-finetuned-sst-2-english";
    const chatWindow = document.getElementById('chatWindow');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const typingBubble = document.getElementById('typingBubble');
    let showEmotions = true; // toggle state

    function speak(t) { speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
    async function detectEmotion(text) {
      const r = await fetch(HF_URL, { method: "POST", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ "inputs": text }) });
      const j = await r.json();
      const lbl = j[0]?.label || "";
      if (lbl.includes("POS")) return "🟢";
      if (lbl.includes("NEG")) return "🔴";
      return "🟡";
    }
    function sendFeedback(m, r) { fetch("http://127.0.0.1:8000/api/feedback/", { method: "POST", headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bot_reply: m, rating: r }) }) }

    async function addMessage(text, sender) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + sender;
      const avatar = document.createElement('img');
      avatar.className = 'avatar';
      avatar.src = (sender === 'user') ? 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' : 'https://cdn-icons-png.flaticon.com/512/4712/4712139.png';
      const bubble = document.createElement('div');
      bubble.className = 'msg ' + sender;
      bubble.innerText = text;
      row.appendChild(avatar); row.appendChild(bubble);

      if (sender === 'bot') {
        speak(text);
        if (showEmotions) {
          const badge = document.createElement('span');
          badge.style.marginLeft = "6px";
          badge.innerText = await detectEmotion(text);
          row.appendChild(badge);
        }
        // feedback
        const like = document.createElement('button');
        like.className = 'btn btn-sm btn-feedback';
        like.innerHTML = '<i class="bi bi-hand-thumbs-up"></i>';
        like.onclick = () => sendFeedback(text, 1);
        const dislike = document.createElement('button');
        dislike.className = 'btn btn-sm btn-feedback';
        dislike.innerHTML = '<i class="bi bi-hand-thumbs-down"></i>';
        dislike.onclick = () => sendFeedback(text, 0);
        row.appendChild(like); row.appendChild(dislike);
      }
      chatWindow.appendChild(row);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function sendToRasa(m) {
      addMessage(m, 'user');
      typingBubble.style.display = 'block';
      fetch("http://localhost:5005/webhooks/rest/webhook", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sender: "user", message: m }) })
        .then(r => r.json()).then(res => {
          typingBubble.style.display = 'none';
          res.forEach(o => addMessage(o.text, 'bot'));
        });
    }

    sendBtn.onclick = () => { const m = input.value.trim(); if (!m) return; input.value = ''; sendToRasa(m); }
    input.addEventListener('keydown', e => { if (e.key === "Enter") { e.preventDefault(); sendBtn.click(); } });

    micBtn.onclick = () => {
      const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      rec.lang = "en-US"; micBtn.innerHTML = "🎙️...";
      rec.start();
      rec.onresult = e => {
        const t = e.results[0][0].transcript;
        input.value = t; micBtn.innerHTML = '<i class="bi bi-mic"></i>'; sendBtn.click();
      };
      rec.onerror = () => { micBtn.innerHTML = '<i class="bi bi-mic"></i>'; alert("Mic error"); }
    };

    // toggle emotion badge
    settingsBtn.onclick = () => {
      showEmotions = !showEmotions;
      settingsBtn.classList.toggle('btn-success', showEmotions);
      settingsBtn.classList.toggle('btn-danger', !showEmotions);
    };
  </script>
</body>

</html>
