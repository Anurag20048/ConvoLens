<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard – ConvoLens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
<header class="custom-header d-flex justify-content-between align-items-center px-4 py-2">
  <div class="d-flex align-items-center"><img src="logo.png" style="height:32px" class="me-2"><span class="fw-bold">ConvoLens</span></div>
  <nav class="d-none d-md-block">
    <a href="index.html" class="mx-3 fw-semibold text-light">Dashboard</a>
    <a href="livechats.html" class="mx-3 text-light">Live Chats</a>
    <a href="analytics.html" class="mx-3 text-light">Analytics</a>
    <a href="contact.html" class="mx-3 text-light">Contact</a>
  </nav>
  <button id="theme-toggle" class="btn border-0 bg-transparent ms-auto fs-4"><i class="bi bi-moon-fill"></i></button>
</header>
<main class="container py-4">
  <div class="row g-4">
    <div class="col-md-6"><div class="card sample-card p-3"><h5>Active Chats</h5><h2>23</h2></div></div>
    <div class="col-md-6"><div class="card sample-card p-3"><h5>Avg Response Time</h5><h2>4.2s</h2></div></div>
  </div>
  <div class="mt-4"><canvas id="intentChart" height="320"></canvas></div>
</main>
<footer class="quick-links text-center py-4 mt-5 border-top">
  <h6>Quick Links</h6>
  <ul class="list-inline"><li class="list-inline-item"><a href="index.html">Dashboard</a></li><li class="list-inline-item"><a href="livechats.html">Live Chats</a></li><li class="list-inline-item"><a href="analytics.html">Analytics</a></li><li class="list-inline-item"><a href="contact.html">Contact</a></li></ul>
  <div class="mt-2 text-muted">© 2026 ConvoLens. All rights reserved.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
<script>new Chart(document.getElementById('intentChart'),{type:'bar',data:{labels:['FAQ','Complaint','Greeting','Order','Refund'],datasets:[{data:[15,8,6,20,5],label:'Intent Frequency',backgroundColor:'var(--primary)',hoverBackgroundColor:'var(--accent)'}]},options:{scales:{y:{beginAtZero:true}}}});</script>
</body>
</html>
