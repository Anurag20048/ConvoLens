<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Analytics – ConvoLens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="light-mode">

  <header class="custom-header d-flex justify-content-between align-items-center px-4 py-2">
    <div class="d-flex align-items-center">
      <img src="logo.png" style="height:32px" class="me-2">
      <span class="fw-bold">ConvoLens</span>
    </div>
    <nav class="d-none d-md-block">
      <a href="index.html" class="mx-3 text-light">Dashboard</a>
      <a href="livechats.html" class="mx-3 text-light">Live Chats</a>
      <a href="analytics.html" class="mx-3 fw-semibold text-light">Analytics</a>
      <a href="contact.html" class="mx-3 text-light">Contact</a>
    </nav>
    <button id="theme-toggle" class="btn border-0 bg-transparent ms-auto fs-4">
      <i class="bi bi-moon-fill"></i>
    </button>

  </header>

  <main class="container py-4">
    <h4>Intent Distribution</h4>
    <canvas id="intentChart" height="320"></canvas>

    <button id="showFeedbackBtn" class="btn btn-outline-primary mt-4">Show Feedback</button>
    <button id="downloadBtn" class="btn btn-primary mt-2 d-none">Download CSV</button>

    <table id="feedbackTable" class="table table-striped mt-3 d-none">
      <thead>
        <tr>
          <th>Bot Reply</th>
          <th>Rating</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <!-- Footer -->
<footer class="quick-links text-center py-4 mt-5 border-top">
  <h6>Quick Links</h6>
  <ul class="list-inline">
    <li class="list-inline-item"><a href="index.html">Dashboard</a></li>
    <li class="list-inline-item"><a href="livechats.html">Live Chats</a></li>
    <li class="list-inline-item"><a href="analytics.html">Analytics</a></li>
    <li class="list-inline-item"><a href="contact.html">Contact</a></li>
  </ul>
  <div class="mt-2 text-muted">© 2026 ConvoLens. All rights reserved.</div>
</footer>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
  <script>
    new Chart(document.getElementById('intentChart'), {
      type: 'bar',
      data: {
        labels: ['FAQ', 'Complaint', 'Greeting', 'Order', 'Refund'],
        datasets: [{
          data: [15, 8, 6, 20, 5],
          label: 'Intent Frequency',
          backgroundColor: 'var(--primary)',
          hoverBackgroundColor: 'var(--accent)'
        }]
      },
      options: { scales: { y: { beginAtZero: true } } }
    });

    // secure feedback with prompt
    const btn = document.getElementById('showFeedbackBtn');
    const table = document.getElementById('feedbackTable');
    const tbody = table.querySelector('tbody');
    const downloadBtn = document.getElementById('downloadBtn');

    btn.onclick = () => {
      const key = prompt("Enter admin password:");
      if (key !== "Ih@temyself") { alert("Access denied"); return; }
      fetch(`http://127.0.0.1:8000/api/feedback/?key=${key}`)
        .then(res => res.json())
        .then(data => {
          table.classList.remove('d-none');
          downloadBtn.classList.remove('d-none');
          tbody.innerHTML = "";
          data.forEach(f => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${f.bot_reply}</td><td>${f.rating ? "👍" : "👎"}</td><td>${new Date(f.created).toLocaleString()}</td>`;
            tbody.appendChild(tr);
          });
        });
    };

    // Download CSV
    downloadBtn.onclick = () => {
      let csv = "Bot Reply,Rating,Created\n";
      [...tbody.querySelectorAll('tr')].forEach(r => {
        const t = r.querySelectorAll('td');
        csv += `"${t[0].innerText.replace(/"/g, '""')}",${t[1].innerText},${t[2].innerText}\n`;
      });
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = "feedback.csv";
      a.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>

</html>
